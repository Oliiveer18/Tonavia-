<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oli en HD-2D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f4ecdc;--tx:#33283a;--bt:#33283a;--bt-tx:#fff6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1824;--tx:#f3e9d8;--bt:#f3e9d8;--bt-tx:#1d1824}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:18px;margin:0;letter-spacing:.02em}
p{margin:2px 0 0;font-size:13px;opacity:.75}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#b9d9b0;touch-action:none}
#stage.fx{background:linear-gradient(#8fc8f5 0%,#cfe6e8 45%,#f7dfb4 100%)}
canvas{display:block;width:100%;height:100%}
#stage.fx canvas{filter:saturate(1.18) contrast(1.06)}
.ts{position:absolute;left:0;right:0;pointer-events:none;display:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#stage.fx .ts{display:block}
#ta{top:0;height:24%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
#tb{bottom:0;height:28%;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
#vig{position:absolute;inset:0;pointer-events:none;display:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,20,50,.35))}
#stage.fx #vig{display:block}
footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:10px 18px;background:var(--bt);color:var(--bt-tx);min-height:44px}
footer span{font-size:12.5px;opacity:.7}
#joy,#run{position:absolute;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#joy{left:max(16px,env(safe-area-inset-left,0px));bottom:16px;width:132px;height:132px;border-radius:50%;background:rgba(255,246,230,.26);border:2px solid rgba(255,246,230,.75);box-shadow:0 2px 10px rgba(30,15,40,.25)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(51,40,58,.88);border:2px solid #fff6e6;pointer-events:none}
#run{right:max(16px,env(safe-area-inset-right,0px));bottom:44px;width:76px;height:76px;border-radius:50%;padding:0;background:rgba(51,40,58,.82);color:#fff6e6;border:2px solid #fff6e6;font-size:13px}
#run.on{background:#d94a3f}
#tag{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));top:10px;font:12px/1.2 ui-monospace,Menlo,monospace;color:#fff6e6;background:rgba(51,40,58,.62);padding:4px 8px;border-radius:6px;pointer-events:none}
@media (hover:hover) and (pointer:fine){#joy,#run{display:none}}
</style></head><body>
